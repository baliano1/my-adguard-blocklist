name: Aggiornamento Feed OSINT

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-blocklist:
    runs-on: ubuntu-latest
    env:
      # Questa riga elimina il warning di Node.js 20 su azioni vecchie (come checkout@v4)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python update_list.py

      # Sostituisce tutto il blocco manuale di Git
      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "OSINT Update: Aggiornamento automatico"
          file_pattern: "filtri-personali.txt"
