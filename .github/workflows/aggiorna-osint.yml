name: Aggiornamento Feed OSINT

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-blocklist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Scarica tutta la cronologia per evitare problemi di rebase

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python update_list.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Forza il recupero delle modifiche remote
          git fetch origin main
          git reset --soft origin/main
          
          git add filtri-personali.txt
          
          # Verifica se ci sono cambiamenti nell'area di stage
          if ! git diff --cached --quiet; then
            git commit -m "OSINT Update: $(date +'%Y-%m-%d')"
            git push origin main
          else
            echo "Nessuna modifica rilevata, salto il push."
          fi
