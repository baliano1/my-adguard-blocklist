name: Aggiornamento Feed OSINT

on:
  schedule:
    - cron: '0 */3 * * *' # Gira ogni 3 ore
  workflow_dispatch: # Permette l'avvio manuale

permissions:
  contents: write

jobs:
  aggiorna-blocklist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5 # Aggiornato a v5 per Node 24
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python update_list.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Sincronizza il repository per evitare l'errore "cannot lock ref"
          git pull origin main --rebase
          
          # Aggiungi il file specifico o tutti i file modificati
          git add filtri-personali.txt
          
          # Commit e Push solo se ci sono cambiamenti
          if ! git diff --cached --quiet; then
            git commit -m "OSINT Update: $(date +'%Y-%m-%d')"
            git push origin main
          else
            echo "Nessuna modifica rilevata."
          fi
